<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/load-css.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球阳光图</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 个人信息 -->
  <div id="top-container"></div>

  <main class="container">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <article class="post glass-ground blog-post">
        <a id="back-article-link" class="back-article">← 返回文章列表</a>
        <div id="sunlight-widget">
            <div class="sw-card glass-ground">
                <div class="sw-header">
                    <span class="sw-title">全球实时日照</span>
                    <div class="sw-info">
                        <span id="sw-time">--:--:--</span>
                        <span id="sw-subsolar">直射点 --°</span>
                    </div>
                </div>
                <canvas id="sw-canvas"></canvas>
                <div class="sw-legend">
                    <span>夜间</span>
                    <span class="sw-gradient"></span>
                    <span>日照</span>
                </div>
            </div>
        </div>
      </article>
    </div>
  </main>

  <div id="footer-container"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="script.js"></script>
</body>
</html>
