<div class="top glass-ground">
  <div class="top-div">
    <div class="top-text">
      <h2 id="user-name">Kerorry</h2>
    </div>
    <button
      class="theme-switch"
      id="themeToggle"
      type="button"
      role="switch"
      aria-checked="false"
      aria-label="切换白天 / 黑夜模式"
      title="切换到夜间模式"
    >
      <span class="theme-switch-track" aria-hidden="true">
        <i class="fas fa-sun theme-switch-icon theme-switch-sun"></i>
        <i class="fas fa-moon theme-switch-icon theme-switch-moon"></i>
        <span class="theme-switch-knob"></span>
      </span>
    </button>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="切换菜单">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</div>
